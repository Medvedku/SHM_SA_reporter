<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHM Week Report - Browser V2</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f5f6f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .vhs-stripes {
            height: 6px;
            width: 100%;
        }

        .bg-1 {
            background-color: #531a46;
        }

        .bg-2 {
            background-color: #9f1e34;
        }

        .bg-3 {
            background-color: #d82b2c;
        }

        .bg-4 {
            background-color: #e4532e;
        }

        .bg-5 {
            background-color: #eea83a;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #531a46;
        }

        .report-meta {
            display: inline-block;
            border-bottom: 2px solid #eea83a;
            padding-bottom: 5px;
            margin-bottom: 10px;
            color: #531a46;
            font-weight: bold;
        }

        /* Main Tabs (Top) */
        .main-tabs {
            display: flex;
            justify-content: center;
            background: #f5f6f7;
            padding: 10px 10px 0 10px;
            border-bottom: 4px solid #531a46;
        }

        .main-tab-btn {
            padding: 12px 24px;
            margin-right: 4px;
            border: 2px solid #531a46;
            border-bottom: none;
            background: #e0e0e0;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #531a46;
            transition: all 0.2s;
        }

        .main-tab-btn:hover {
            background: #eea83a;
            color: #fff;
        }

        .main-tab-btn.active {
            background: #531a46;
            color: #fff;
        }

        /* Sub Tabs (Secondary) */
        .sub-tab-container {
            background: #e0e0e0;
            padding: 10px;
            border-bottom: 2px solid #ccc;
            text-align: center;
            /* Center aligning buttons */
        }

        .sub-tab-btn {
            display: inline-block;
            padding: 8px 16px;
            margin: 4px;
            background: #fff;
            border: 1px solid #531a46;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #531a46;
            transition: all 0.2s;
            box-shadow: 2px 2px 0 #9f1e34;
        }

        .sub-tab-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 #9f1e34;
        }

        .sub-tab-btn.active {
            background: #531a46;
            color: #fff;
            box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.5);
            transform: translate(1px, 1px);
        }

        /* Content Area */
        .tab-content {
            display: none;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        .view-area {
            flex: 1;
            padding: 20px;
            background: #fff;
            min-height: 750px;
        }

        iframe {
            width: 100%;
            height: 750px;
            border: none;
            display: none;
            /* Hide all by default */
        }

        iframe.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.8em;
            color: #531a46;
            background-color: #f9f9f9;
            border-top: 1px solid #ddd;
        }

        /* Strain Grid Nav */
        .strain-grid-nav {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding: 10px;
            background: #e0e0e0;
            border-bottom: 2px solid #ccc;
        }

        .strain-col {
            display: flex;
            flex-direction: column;
        }

        .strain-col h4 {
            margin: 0 0 5px 0;
            font-size: 11px;
            text-align: center;
            color: #531a46;
            text-transform: uppercase;
            border-bottom: 1px solid #9f1e34;
            padding-bottom: 2px;
        }

        .strain-col .sub-tab-btn {
            width: 100%;
            margin: 2px 0;
            box-sizing: border-box;
            text-align: left;
            padding: 6px 10px;
        }
    </style>
</head>

    <script>
        function openMainTab(tabId) {
            // Hide all main tabs
            var tabs = document.getElementsByClassName("tab-content");
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
                // Also hide this via display:none logic just in case CSS flex interferes
                tabs[i].style.display = "none";
            }

            // Deactivate all main buttons
            var btns = document.getElementsByClassName("main-tab-btn");
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
            }

            // Show target tab
            var target = document.getElementById(tabId);
            target.style.display = "flex";
            setTimeout(() => target.classList.add("active"), 10); // logic fix

            // Activate button
            event.currentTarget.classList.add("active");
        }

        function openSubTab(parentId, frameId) {
            // Parent context
            var parent = document.getElementById(parentId);

            // Deactivate sub-buttons in this context
            // Note: We need to search deeper now because of the grid structure in 'strain'
            // Using querySelectorAll to find all buttons within the parent container
            var btns = parent.querySelectorAll(".sub-tab-btn");
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
            }

            // Hide all iframes in this context
            var frames = parent.getElementsByTagName("iframe");
            for (var i = 0; i < frames.length; i++) {
                frames[i].classList.remove("active");
            }

            // Activate clicked button
            event.currentTarget.classList.add("active");

            // Show target iframe
            document.getElementById(frameId).classList.add("active");
        }

        // Init state: ensure display is correct on load
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("vibration").style.display = "flex";
        });
    </script>
